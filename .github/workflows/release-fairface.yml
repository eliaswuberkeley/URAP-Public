name: Verify and publish FairFace images
on:
  push:
    tags:
      - fairface-v1.0.0
permissions:
  contents: read
concurrency:
  group: fairface-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'eliaswuberkeley/URAP-Public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned replay dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Verify data, code and tests
        run: |
          python scripts/verify.py
          python -m pytest fairface/tests -q
          python fairface/scripts/reproduce.py
          python fairface/scripts/audit_release.py
      - name: Reconstruct and verify all 4000 portraits
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python fairface/scripts/reproduce.py --rebuild-images --download
          python scripts/build_release.py
      - name: Publish versioned download without overwriting prior assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create fairface-v1.0.0 \
            dist/fairface-matched-v1.0.0.zip dist/SHA256SUMS.txt dist/release-manifest.json \
            --verify-tag --title 'FairFace matched sample v1.0.0: 2000 pairs / 4000 portraits' \
            --notes-file RELEASE_NOTES.md
